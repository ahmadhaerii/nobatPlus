<section class="help">
  <!-- جستجو -->
  <div class="hero">
    <span class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26">
        <circle
          cx="12"
          cy="12"
          r="9"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        />
        <path
          d="M9.5 9.5a2.6 2.6 0 115 .6c0 1.6-2.5 1.9-2.5 3.4M12 17v.1"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </span>
    <h1>موضوع پرسش شما چیست؟</h1>
    <p>موضوع مورد نظرتان را جستجو کرده یا از پرسش های متداول زیر انتخاب کنید</p>

    <label class="search">
      <input
        type="search"
        placeholder="جستجو"
        [ngModel]="query"
        (ngModelChange)="onSearch($event)"
        aria-label="جستجو در پرسش‌های متداول"
      />
      <span class="search__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <circle
            cx="11"
            cy="11"
            r="6.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M16 16l4.5 4.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </span>
    </label>
  </div>

  <!-- پرسش‌های متداول -->
  <div class="faq">
    <span class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26">
        <path
          d="M5 4h14a1 1 0 011 1v10a1 1 0 01-1 1h-8l-4 4v-4H5a1 1 0 01-1-1V5a1 1 0 011-1z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        />
        <path
          d="M10 8.6a2 2 0 113.6 1.2c-.7.8-1.6 1-1.6 2M12 13.6v.1"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </span>
    <h2>پرسش های متداول</h2>

    <div class="list" *ngIf="filtered.length; else empty">
      <article
        class="item"
        *ngFor="let item of filtered"
        [class.item--open]="openId === item.id"
      >
        <button
          type="button"
          class="item__head"
          [attr.aria-expanded]="openId === item.id"
          (click)="toggle(item)"
        >
          <span class="item__q">{{ item.title }}</span>
          <svg
            class="item__chev"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            aria-hidden="true"
          >
            <path
              d="M6 9l6 6 6-6"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div class="item__body">
          <div class="item__inner">
            <p>{{ item.description }}</p>
          </div>
        </div>
      </article>
    </div>

    <ng-template #empty>
      <p class="empty">
        {{ loading ? "در حال بارگذاری..." : "موردی یافت نشد." }}
      </p>
    </ng-template>
  </div>
</section>
