<section class="home">
  <div class="intro">
    <h1>پنجره شروع خدمات مناطق آزاد</h1>
    <h2>مراجعه کننده گرامی<span class="bang">!</span></h2>
    <p>
      این سامانه به‌منظور ساماندهی ارائه خدمات دولتی و تسهیل نوبت‌گیری مراجعان
      محترم طراحی شده است. همکاری شما در برنامه‌ریزی زمان حضور، ما را در ارائه
      خدمات بهتر یاری می‌نماید. با سپاس از همراهی شما
    </p>
  </div>

  <button
    *ngIf="auth.user$ | async"
    type="button"
    class="my-services"
    (click)="open('my-services')"
  >
    <span class="my-services__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24">
        <path
          d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
        />
      </svg>
    </span>
    <span class="my-services__text">
      <b>خدمات من</b>
      <small>مشاهده‌ی نوبت‌ها و خدمات دریافتی شما</small>
    </span>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path
        d="M15 6l-6 6 6 6"
        fill="none"
        stroke="currentColor"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <div class="panel">
    <div class="panel__head">
      <span>خدمات منطقه آزاد ماکو</span>
      <img class="logo-company" src="assets/images/logo.png" alt="NobatPlus" />
    </div>
    <div class="panel__body">
      <button
        *ngFor="let service of services"
        type="button"
        class="service"
        (click)="open('slots/' + service.serviceTypeId)"
      >
        <span class="service__icon"
          ><img
            src="assets/images/Maku-Vehicle-Plate-Exchange-Banner.png"
            alt=""
        /></span>
        <span class="service__btn"
          >{{ service.serviceTitle }}
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path
              d="M15 6l-6 6 6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            /></svg
        ></span>
      </button>
    </div>
  </div>
</section>
