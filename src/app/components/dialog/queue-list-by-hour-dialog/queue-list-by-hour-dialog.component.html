<div class="grid grid-cols-1">
  <core-card class="main-card overflow-auto col-span-1 justify-between mt-4">
    <div class="flex justify-between bg-background-color px-3">
      <b class="m-4 self-center">{{ labels.contentCardTitle }}</b>
      <close-icon
        (click)="close()"
        class="hover:cursor-pointer w-6"
      ></close-icon>
    </div>
    <div class="md:flex justify-between p-3">
      <div class="py-3 md:py-0 md:flex">
        <b class="text-primary-text-color text-xl me-4"> </b>
      </div>
      <div>
        <div class="grid grid-cols-3 gap-x-2 pt-2">
          <core-btn
            class="col-span-1"
            filterTable
            [key]="tableKey"
            [columnsSchema]="columnsSchema"
          >
            <div class="flex">
              <filter-alt-icon class="h-5 w-5 fill-secondary-text-color">
              </filter-alt-icon>
              {{ labels.filterButtonName }}
            </div>
          </core-btn>
          <core-btn class="col-span-1">
            <button
              class="flex w-full"
              printSectionId="print-section"
              ngxPrint
              [useExistingCss]="true"
            >
              <print-icon class="h-5 w-5 fill-secondary-text-color">
              </print-icon>
              {{ labels.printButtonName }}
            </button>
          </core-btn>
          <core-btn class="col-span-1" (btnClicked)="exportExcel()">
            <div class="flex">
              <list-alt-icon class="h-5 w-5 fill-secondary-text-color">
              </list-alt-icon>
              {{ labels.excelButtonName }}
            </div>
          </core-btn>
        </div>
      </div>
    </div>
    <div class="col-span-1">
      <core-spinner
        *ngIf="loading"
        class="w-full px-3 block"
        type="line"
      ></core-spinner>
      <div id="print-section">
        <core-table
          dir="rtl"
          id="excel-table"
          [key]="tableKey"
          [columnsSchema]="columnsSchema"
          [tableData]="tableData"
          [loading]="loading"
          [responsive]="false"
        ></core-table>
      </div>
    </div>
  </core-card>
</div>
