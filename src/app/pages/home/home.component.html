<section class="home">
  <div class="intro">
    <h1>مراجعه کننده گرامی<span class="bang">!</span></h1>
    <p>
      این سامانه به‌منظور ساماندهی ارائه خدمات دولتی و تسهیل نوبت‌گیری مراجعان
      محترم طراحی شده است. همکاری شما در برنامه‌ریزی زمان حضور، ما را در ارائه
      خدمات بهتر یاری می‌نماید. با سپاس از همراهی شما
    </p>
  </div>

  <div class="panel">
    <div class="panel__head">نوع خدمات مورد نظر را انتخاب کنید</div>
    <div class="panel__body">
      <button
        *ngFor="let s of services; trackBy: trackById"
        type="button"
        class="service"
        (click)="open(s.route)"
      >
        <span class="service__icon"
          ><img src="assets/images/logo.svg" alt=""
        /></span>
        <span class="service__btn">{{ s.title }}</span>
      </button>
    </div>
  </div>
</section>
